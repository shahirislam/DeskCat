name: Build DeskCat.exe

# Builds the single-file Windows app on every push to main, or by hand from
# the Actions tab ("Run workflow"). Download it from the run's Artifacts.
#
# To publish a new version for friends: push a tag such as v1.1.0
#     git tag v1.1.0 && git push origin v1.1.0
# and the exe is attached to a GitHub release with that name.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the exe
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --disable-pip-version-check pyinstaller -r requirements.txt
      - name: Build
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name DeskCat --icon deskcat.ico --add-data "meow.wav;." deskcat.py
      - name: Start the exe and check the cat appears
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\DeskCat.exe"
          $log = Join-Path $PWD "dist\deskcat.log"
          $proc = Start-Process -FilePath $exe -ArgumentList "--zoomies" -PassThru
          Start-Sleep -Seconds 25
          if (Test-Path $log) { Get-Content $log }
          $alive = -not $proc.HasExited
          Get-Process DeskCat -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $alive) { throw "DeskCat.exe exited by itself (exit code $($proc.ExitCode))" }
          if (-not (Test-Path $log)) { throw "DeskCat.exe wrote no log" }
          if (-not (Select-String -Path $log -Pattern "Cat window shown" -Quiet)) { throw "The cat window never appeared" }
          Remove-Item $log
      - uses: actions/upload-artifact@v4
        with:
          name: DeskCat-windows
          path: dist/DeskCat.exe
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, tests, setup-script]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DeskCat-windows
      - name: Create the release with DeskCat.exe attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          **Download `DeskCat.exe` below and double-click it.** Nothing to install.

          The first time, Windows may show a blue "Windows protected your PC" box because the file is not signed by a company. Click **More info**, then **Run anyway**.

          Right-click the cat to quit.
          NOTES
          gh release create "$TAG" DeskCat.exe --repo "$GITHUB_REPOSITORY" --title "DeskCat $TAG" --notes-file notes.md --verify-tag

  tests:
    name: Tests on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest -r requirements.txt
      - run: python -m pytest tests -q -p no:cacheprovider
        env:
          QT_QPA_PLATFORM: offscreen

  setup-script:
    name: run_windows.bat installs PyQt6 by itself
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make sure PyQt6 is not there yet
        shell: pwsh
        run: |
          python -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('PyQt6') else 0)"
          if ($LASTEXITCODE -ne 0) { throw "PyQt6 is already installed, so this would prove nothing" }
      - name: Double-click run_windows.bat (in effect)
        shell: cmd
        run: call run_windows.bat < nul
      - name: Check the cat started
        shell: pwsh
        run: |
          Start-Sleep -Seconds 15
          if (Test-Path deskcat.log) { Get-Content deskcat.log }
          $running = Get-Process pythonw, python -ErrorAction SilentlyContinue
          $running | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path deskcat.log)) { throw "The cat wrote no log" }
          if (-not (Select-String -Path deskcat.log -Pattern "Cat window shown" -Quiet)) { throw "The cat window never appeared" }
